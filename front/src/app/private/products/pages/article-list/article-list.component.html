<div class="flex flex-col h-full">

  <!-- Filtres et bouton d'ajout -->
  <div class="flex flex-col sm:flex-row justify-between items-center mb-4">
    <form [formGroup]="searchForm" class="w-full sm:w-1/3 relative mb-4 sm:mb-0">
      <input type="text"
             formControlName="searchTerm"
             class="w-full p-2.5 pl-10 text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
             placeholder="Rechercher un article...">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
        </svg>
      </div>
    </form>

    <app-button type="primary" [icon]="icons.add" (click)="goToArticleDetail(0)">Ajouter un article</app-button>

  </div>

  <!-- Tableau avec défilement -->
  <div class="flex-grow flex flex-col overflow-hidden">
    <div class="overflow-x-auto shadow-md sm:rounded-lg max-h-[calc(100vh-12rem)]">
      <table class="w-full text-sm text-left rtl:text-right text-gray-700">
        <thead class="text-xs text-white uppercase bg-gray-700 sticky top-0 z-10">
          <tr>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('referenceCode')"
              [attr.aria-sort]="sortColumn === 'referenceCode' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Référence<app-sort-icon [direction]="sortColumn === 'referenceCode' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('barCode')"
              [attr.aria-sort]="sortColumn === 'barCode' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Code barre<app-sort-icon [direction]="sortColumn === 'barCode' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('label')"
              [attr.aria-sort]="sortColumn === 'label' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Désignation<app-sort-icon [direction]="sortColumn === 'label' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('category')"
              [attr.aria-sort]="sortColumn === 'category' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Catégorie<app-sort-icon [direction]="sortColumn === 'category' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('unitPrice')"
              [attr.aria-sort]="sortColumn === 'unitPrice' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Prix unitaire<app-sort-icon [direction]="sortColumn === 'unitPrice' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3 cursor-pointer select-none group" (click)="sortArticles('quantity')"
              [attr.aria-sort]="sortColumn === 'quantity' && sortDirection ? (sortDirection === 'asc' ? 'ascending' : 'descending') : null">
              <span class="inline-flex items-center gap-1.5 whitespace-nowrap">Quantité en stock<app-sort-icon [direction]="sortColumn === 'quantity' ? sortDirection : null"></app-sort-icon></span>
            </th>
            <th scope="col" class="px-6 py-3">
              Actions
            </th>
          </tr>
        </thead>
        <tbody>
            <tr *ngFor="let article of filteredArticles"
            class="odd:bg-white even:bg-gray-100 hover:bg-gray-200 border-b">
                <th scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap cursor-pointer" (click)="goToArticleDetail(article.id)">
                  {{article.referenceCode}}
                </th>
                <td class="px-6 py-4 cursor-pointer" (click)="goToArticleDetail(article.id)">
                  {{article.barCode}}
                </td>
                <td class="px-6 py-4 cursor-pointer" (click)="goToArticleDetail(article.id)">
                  {{article.label}}
                </td>
                <td class="px-6 py-4 cursor-pointer" (click)="goToArticleDetail(article.id)">
                  {{article.oCategory.label}}
                </td>
                <td class="px-6 py-4 cursor-pointer" (click)="goToArticleDetail(article.id)">
                  {{article.unitPrice | round}} €
                </td>
                <td class="px-6 py-4">
                  <ng-container *ngIf="!editingRow[article.id]; else editMode">
                    <span class="font-semibold text-base">{{ getArticleQuantity(article) }}</span>
                    <app-button
                      *ngIf="!editingRow[article.id] && article.tInventoryLine?.length > 0"
                      type="secondary"
                      size="icon"
                      [icon]="icons.edit"
                      class="ml-2"
                      (click)="$event.stopPropagation(); startEditing(article)"
                      title="Modifier le stock"
                    ></app-button>
                  </ng-container>
                  <ng-template #editMode>
                    <div class="flex items-center gap-2">
                      <app-input
                        type="number"
                        [formControl]="editQuantityControl"
                        class="w-24"
                      ></app-input>
                      <app-button type="primary" size="sm" (click)="saveQuantity(article, $event)">Valider</app-button>
                      <app-button size="sm" (click)="cancelEditing()">Annuler</app-button>
                    </div>
                  </ng-template>

                </td>
                <td class="px-6 py-4">
                  <div class="flex items-center gap-2">
                    <app-button
                      type="danger"
                      size="icon"
                      [icon]="icons.delete"
                      (click)="$event.stopPropagation(); softDelete(article.id)"
                      title="Supprimer l'article"
                    ></app-button>
                  </div>
                </td>
            </tr>
            <ng-container *ngIf="filteredArticles.length === 0">
              <tr
              class="bg-white border-b">
                  <td scope="row" class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap" colspan="8">
                      Pas d'article trouvé
                  </td>
                </tr>
            </ng-container>
        </tbody>
      </table>
    </div>
  </div>
</div>
